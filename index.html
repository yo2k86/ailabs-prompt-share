<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ailabs Workspace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter, Orbitron, & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tech: ['Orbitron', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        neonBlue: '#00ffd5',
                        neonOrange: '#FF9900',
                        deepDark: '#050110',
                        accentPurple: '#7c3aed'
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow-pulse': 'glowPulse 2s infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'neon-flicker': 'flicker 3s linear infinite',
                    },
                    keyframes: {
                        glowPulse: {
                            '0%, 100%': { boxShadow: '0 0 5px #00ffd5', filter: 'brightness(1)' },
                            '50%': { boxShadow: '0 0 20px #00ffd5', filter: 'brightness(1.2)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        flicker: {
                             '0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100%': {
                                opacity: 0.99,
                                filter: 'drop-shadow(0 0 1px rgba(0,255,213,1))'
                            },
                            '20%, 21.999%, 63%, 63.999%, 65%, 69.999%': {
                                opacity: 0.4,
                                filter: 'none'
                            }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: #050110 radial-gradient(circle at center, #1a0b2e 0%, #050110 100%); 
            overflow-x: hidden;
            text-shadow: 0 2px 8px rgba(0,0,0,1); 
            color: white;
        }

        #bg-video {
            position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto;
            z-index: -2; transform: translateX(-50%) translateY(-50%); object-fit: cover; opacity: 0.8; 
        }

        /* MATIKAN VIDEO DI MOBILE UNTUK MENCEGAH CRASH */
        @media (max-width: 768px) {
            #bg-video { display: none !important; }
            body { background: linear-gradient(135deg, #050110 0%, #1a0b2e 50%, #050110 100%); }
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 85% 85%, rgba(255, 153, 0, 0.05) 0%, transparent 50%), rgba(0, 0, 0, 0.1); 
            z-index: -1;
        }

        /* OPTIMASI GLASSMORPHISM: BLUR DIMATIKAN DI MOBILE (Hanya Desktop) */
        .glass-panel {
            background: rgba(15, 10, 25, 0.85); /* Solid color untuk fallback HP */
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-top: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        @media (min-width: 768px) {
            .glass-panel {
                background: rgba(10, 10, 15, 0.15); 
                backdrop-filter: blur(8px); 
                -webkit-backdrop-filter: blur(8px);
            }
        }

        /* Tabs Styles */
        .tab-btn {
            position: relative; padding: 10px 14px; font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 0.65rem;
            letter-spacing: 1px; text-shadow: 0px 1px 0px rgba(255, 255, 255, 0.2), 0px 2px 0px rgba(0, 0, 0, 0.8), 0px 3px 2px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: rgba(255, 255, 255, 0.6); background: rgba(0, 0, 0, 0.4); 
            border-top: 1px solid rgba(255, 255, 255, 0.05); border-bottom: 1px solid rgba(255, 255, 255, 0.1); border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 3px solid transparent; border-radius: 16px 4px 16px 4px; display: flex; align-items: center; justify-content: center;
            text-align: center; flex: 1; min-width: 140px; max-width: 250px; gap: 8px; box-shadow: 2px 4px 10px rgba(0,0,0,0.4);
        }
        @media (min-width: 768px) { .tab-btn { padding: 12px 18px; font-size: 0.75rem; letter-spacing: 2px; min-width: 180px; } }
        @media (min-width: 768px) { .tab-btn.active { animation: flicker 4s linear infinite; } }

        /* Specific Tabs */
        #tab-apps { border-left-color: rgba(0, 255, 213, 0.4); color: rgba(0, 255, 213, 0.9); }
        #tab-apps:hover { color: #00ffd5; border-left-color: #00ffd5; background: rgba(0, 255, 213, 0.1); box-shadow: 0 0 10px rgba(0, 255, 213, 0.3); transform: translateY(-2px); }
        #tab-apps.active { color: #ffffff; border-left-width: 4px; border-left-color: #00ffd5; background: rgba(0, 255, 213, 0.15); box-shadow: 0 0 15px rgba(0, 255, 213, 0.5), inset 0 0 10px rgba(0, 255, 213, 0.3); text-shadow: 0 1px 0 #00cca0, 0 2px 0 #00997a, 0 3px 0 #006652, 0 4px 5px rgba(0, 255, 213, 0.8), 0 0 10px rgba(0, 255, 213, 1); transform: translateY(1px); }

        #tab-apps2 { padding: 2px !important; border: none !important; background: transparent !important; overflow: hidden; position: relative; border-radius: 18px 6px 18px 6px !important; box-shadow: none; }
        #tab-apps2::before { content: ''; position: absolute; top: 50%; left: 50%; width: 250%; height: 250%; background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 240deg, #ff0000 280deg, #ff8c00 320deg, #ffff00 360deg); animation: spin-fire 3s linear infinite; transform: translate(-50%, -50%); z-index: 0; will-change: transform; }
        .fire-tab-inner { position: relative; z-index: 1; background: rgba(10, 5, 20, 0.9); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 16px 4px 16px 4px !important; padding: 8px 10px; color: rgba(255, 69, 0, 0.9); transition: all 0.3s ease; text-align: center; gap: 8px; }
        @media (min-width: 768px) { .fire-tab-inner { padding: 10px 16px; } }
        #tab-apps2:hover .fire-tab-inner { background: rgba(255, 69, 0, 0.1); color: #ff8c00; }
        #tab-apps2.active .fire-tab-inner { background: rgba(255, 69, 0, 0.2); color: #ffffff; box-shadow: inset 0 0 10px rgba(255, 69, 0, 0.3); text-shadow: 0 1px 0 #cc3700, 0 2px 0 #992900, 0 3px 0 #661c00, 0 4px 5px rgba(255, 69, 0, 0.8), 0 0 10px rgba(255, 69, 0, 1); }

        #tab-toolkit { border-left-color: rgba(234, 179, 8, 0.4); color: rgba(250, 204, 21, 0.9); }
        #tab-toolkit:hover { color: #fef08a; border-left-color: #facc15; background: rgba(234, 179, 8, 0.1); box-shadow: 0 0 10px rgba(234, 179, 8, 0.3); transform: translateY(-2px); }
        #tab-toolkit.active { color: #ffffff; border-left-width: 4px; border-left-color: #eab308; background: rgba(234, 179, 8, 0.2); box-shadow: 0 0 15px rgba(234, 179, 8, 0.6), inset 0 0 10px rgba(234, 179, 8, 0.3); text-shadow: 0 1px 0 #a16207, 0 2px 0 #854d0e, 0 3px 0 #713f12, 0 4px 5px rgba(234, 179, 8, 0.8), 0 0 10px rgba(234, 179, 8, 1); transform: translateY(1px); }

        #tab-tutorial { border-left-color: rgba(255, 153, 0, 0.4); color: rgba(255, 153, 0, 0.9); }
        #tab-tutorial:hover { color: #ffedd5; border-left-color: #FF9900; background: rgba(255, 153, 0, 0.1); box-shadow: 0 0 10px rgba(255, 153, 0, 0.3); transform: translateY(-2px); }
        #tab-tutorial.active { color: #ffffff; border-left-width: 4px; border-left-color: #f97316; background: rgba(255, 153, 0, 0.2); box-shadow: 0 0 15px rgba(255, 153, 0, 0.6), inset 0 0 10px rgba(255, 153, 0, 0.3); text-shadow: 0 1px 0 #c2410c, 0 2px 0 #9a3412, 0 3px 0 #7c2d12, 0 4px 5px rgba(255, 153, 0, 0.8), 0 0 10px rgba(255, 153, 0, 1); transform: translateY(1px); }

        #tab-camera { border-left-color: rgba(16, 185, 129, 0.4); color: rgba(52, 211, 153, 0.9); }
        #tab-camera:hover { color: #a7f3d0; border-left-color: #34d399; background: rgba(16, 185, 129, 0.1); box-shadow: 0 0 10px rgba(16, 185, 129, 0.3); transform: translateY(-2px); }
        #tab-camera.active { color: #ffffff; border-left-width: 4px; border-left-color: #10b981; background: rgba(16, 185, 129, 0.2); box-shadow: 0 0 15px rgba(16, 185, 129, 0.6), inset 0 0 10px rgba(16, 185, 129, 0.3); text-shadow: 0 1px 0 #047857, 0 2px 0 #065f46, 0 3px 0 #064e3b, 0 4px 5px rgba(16, 185, 129, 0.8), 0 0 10px rgba(16, 185, 129, 1); transform: translateY(1px); }

        /* Card Styles */
        .app-card { background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(0, 255, 213, 0.3); box-shadow: 0 0 15px rgba(0, 255, 213, 0.1); transition: all 0.4s ease; position: relative; overflow: hidden; cursor: pointer; display: block; z-index: 10; pointer-events: auto; }
        .app-card:hover { transform: translateY(-5px); background: rgba(0, 255, 213, 0.1); border-color: #00ffd5; box-shadow: 0 0 30px rgba(0, 255, 213, 0.4), inset 0 0 10px rgba(0, 255, 213, 0.1); }
        
        .tutorial-card, .framework-card { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 153, 0, 0.3); transition: all 0.3s ease; display: flex; flex-direction: column; z-index: 10; pointer-events: auto; }
        .tutorial-card:hover, .framework-card:hover { border-color: #FF9900; box-shadow: 0 0 20px rgba(255, 153, 0, 0.2); transform: translateY(-4px); }

        /* Custom Fire Card Style - OPTIMIZED FOR MOBILE GPU */
        .fire-card-wrapper { position: relative; overflow: hidden; border-radius: 1rem; padding: 2px; box-shadow: 0 0 15px rgba(255, 69, 0, 0.1); transition: all 0.4s ease; cursor: pointer; display: block; z-index: 10; pointer-events: auto; }
        .fire-card-wrapper:hover { transform: translateY(-5px); box-shadow: 0 0 30px rgba(255, 69, 0, 0.5); }
        .fire-card-wrapper::before { content: ''; position: absolute; top: 50%; left: 50%; width: 250%; height: 250%; background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 240deg, #ff0000 280deg, #ff8c00 320deg, #ffff00 360deg); animation: spin-fire 2.5s linear infinite; transform: translate(-50%, -50%); z-index: 0; will-change: transform; }
        .fire-card-inner { position: relative; z-index: 1; background: #0a0514; border-radius: calc(1rem - 2px); height: 100%; }
        @keyframes spin-fire { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        
        .fire-banner-wrapper { position: relative; overflow: hidden; border-radius: 0.75rem; padding: 2px; box-shadow: 0 0 20px rgba(255, 69, 0, 0.3); margin-bottom: 1.5rem; }
        .fire-banner-wrapper::before { content: ''; position: absolute; top: 50%; left: 50%; width: 250%; height: 250%; min-width: 800px; min-height: 800px; background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 240deg, #ff0000 280deg, #ff8c00 320deg, #ffff00 360deg); animation: spin-fire 4s linear infinite; transform: translate(-50%, -50%); z-index: 0; will-change: transform; }
        .fire-banner-inner { position: relative; z-index: 1; background: #0a0514; border-radius: calc(0.75rem - 2px); padding: 12px 20px; display: flex; align-items: center; width: 100%; }

        .v-bar { width: 4px; background: #00ffd5; border-radius: 2px 2px 0 0; box-shadow: 0 0 5px #00ffd5; transition: height 0.08s ease; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 255, 213, 0.5); }
    </style>
</head>

        const _d = (s) => atob(s); // Fungsi dekoder

        // =========================================================================
        // JAVASCRIPT SMART LINK OPENER (ANTI SECURITY LOOP GOOGLE)
        // =========================================================================
        function smartOpen(e, url) {
            if(e) e.preventDefault();
            
            // Deteksi In-App Browser (WebView) seperti WhatsApp, FB, IG, TikTok, atau PWA Standalone
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isWebView = /(Instagram|FBAN|FBAV|WhatsApp|Line|TikTok|wv)/i.test(ua);
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

            try {
                if (isWebView || isStandalone) {
                    // Jika di WebView, Tab Baru akan memicu loop keamanan Google karena cookie ditolak.
                    // Oleh karena itu, di sini kita PAKSA navigasi top-level agar tidak blank/loop.
                    window.top.location.href = url;
                } else {
                    // Jika di Browser Biasa (Chrome, Safari PC/HP), aman buka Tab Baru
                    let newWin = window.open(url, '_blank', 'noopener,noreferrer');
                    if (!newWin || newWin.closed || typeof newWin.closed === 'undefined') {
                        // Fallback jika popup blocker aktif
                        window.top.location.href = url;
                    }
                }
            } catch (err) {
                // Fallback darurat
                window.top.location.href = url;
            }
        }

        // =========================================================================
        // AUDIO & VISUALIZER SCRIPT
        // =========================================================================
        const bgAudio = document.getElementById("bg-audio");
        bgAudio.volume = 0.5;
        let audioCtx, analyser, dataArray, isInit = false;
        let cachedVBars = []; 

        function initVisualizer() {
            if(isInit) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const src = audioCtx.createMediaElementSource(bgAudio);
                analyser = audioCtx.createAnalyser();
                src.connect(analyser); analyser.connect(audioCtx.destination);
                analyser.fftSize = 64; dataArray = new Uint8Array(analyser.frequencyBinCount);
                cachedVBars = document.querySelectorAll('.v-bar'); 
                isInit = true; draw();
            } catch(e) {}
        }
        function draw() {
            if(!analyser || cachedVBars.length === 0) return;
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            if (!document.hidden) {
                cachedVBars.forEach((bar, i) => { bar.style.height = `${Math.max(2, (dataArray[i]/255)*12)}px`; });
            }
        }

        function switchTab(tab) {
            ['content-apps', 'content-apps2', 'content-toolkit', 'content-tutorial', 'content-camera'].forEach(id => document.getElementById(id)?.classList.add('hidden'));
            ['tab-apps', 'tab-apps2', 'tab-toolkit', 'tab-tutorial', 'tab-camera'].forEach(id => document.getElementById(id)?.classList.remove('active'));
            document.getElementById(`content-${tab}`)?.classList.remove('hidden');
            document.getElementById(`tab-${tab}`)?.classList.add('active');
        }

        // =========================================================================
        // LOGIN & SPREADSHEET SCRIPT

        function toggleLoginForm() {
            const form = document.getElementById('email-input-section');
            form.classList.toggle('hidden');
            if(!form.classList.contains('hidden')) document.getElementById('login-email-input').focus();
        }

        async function submitEmailLogin() {
            const email = document.getElementById('login-email-input').value.trim();
            if(!email) { document.getElementById('error-message').textContent = 'Email kosong!'; return; }
            
            const errorMsg = document.getElementById('error-message');
            const submitBtn = document.getElementById('btn-submit-login');
            errorMsg.innerHTML = '<span class="text-neonBlue animate-pulse">Menghubungkan Database...</span>';
            submitBtn.disabled = true; submitBtn.style.opacity = '0.5';
            
            const API_URL = "https://script.google.com/macros/s/AKfycbz1FR3bB6-GpVvertVerKUK7WnpTJoEt_mZ0Y7L8YAdkcI7R7q69vPhwr8tnz585DTUVQ/exec";
            try {
                const response = await fetch(`${API_URL}?email=${encodeURIComponent(email)}`);
                const data = await response.json();
                submitBtn.disabled = false; submitBtn.style.opacity = '1';
                if(data.success) loginSuccess(data.email, data.username);
                else errorMsg.textContent = 'Akses Ditolak: ' + data.message;
            } catch(e) {
                submitBtn.disabled = false; submitBtn.style.opacity = '1';
                errorMsg.textContent = 'Gagal terhubung ke Database.';
            }
        }

        function loginSuccess(email, username) {
            sessionStorage.setItem('ai_secure_token', btoa(email));
            sessionStorage.setItem('ailabs_email', email);
            sessionStorage.setItem('ailabs_username', username || email);
            
            document.getElementById('user-email-display').textContent = email;
            document.getElementById('user-name-display').textContent = username || email;
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('portal-page').classList.remove('hidden');
            
            _bDOM();

            if(bgAudio.paused) bgAudio.play().then(() => initVisualizer()).catch(() => {});
        }

        // =========================================================================
        // SECURITY & ANTI-HACKER TRAPS
        // =========================================================================
        let hasInteracted = false;
        const _pi = () => {
            if (hasInteracted) return; hasInteracted = true;
            bgAudio.play().then(() => { initVisualizer(); if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }).catch(()=>{ hasInteracted = false; });
            document.removeEventListener('click', _pi); document.removeEventListener('keydown', _pi);
        };
        document.addEventListener('click', _pi); document.addEventListener('keydown', _pi);

        document.getElementById('logout-button').addEventListener('click', () => {
            sessionStorage.clear(); location.reload();
        });

        document.getElementById('sound-toggle').addEventListener('click', () => {
            bgAudio.muted = !bgAudio.muted;
            document.getElementById('icon-sound-on').classList.toggle('hidden', bgAudio.muted);
            document.getElementById('icon-sound-off').classList.toggle('hidden', !bgAudio.muted);
            if(!bgAudio.muted && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (!bgAudio.muted && bgAudio.paused) bgAudio.play().then(() => initVisualizer()).catch(() => {});
        });
        document.getElementById('volume-slider').addEventListener('input', (e) => bgAudio.volume = e.target.value );

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('ai_secure_token') && sessionStorage.getItem('ailabs_email')) {
                loginSuccess(sessionStorage.getItem('ailabs_email'), sessionStorage.getItem('ailabs_username'));
            }
        });

        // Tweak Anti-Inspect agar tidak memblokir tap di layar HP secara tidak sengaja
        document.addEventListener('contextmenu', e => {
            if (e.target.closest('a') || e.target.closest('button')) return; // Izinkan tap normal di HP
            e.preventDefault();
        });
        document.addEventListener('keydown', function(e) {
            if(e.key==='F12'||e.keyCode===123) { e.preventDefault(); return false; }
            if(e.ctrlKey && e.shiftKey && (e.key==='I'||e.key==='i'||e.keyCode===73)) { e.preventDefault(); return false; }
            if(e.ctrlKey && e.shiftKey && (e.key==='J'||e.key==='j'||e.keyCode===74)) { e.preventDefault(); return false; }
            if(e.ctrlKey && (e.key==='U'||e.key==='u'||e.keyCode===85)) { e.preventDefault(); return false; }
            if(e.ctrlKey && e.shiftKey && (e.key==='C'||e.key==='c'||e.keyCode===67)) { e.preventDefault(); return false; }
        });
